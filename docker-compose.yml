name: fastapi-server-test

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the shell or .env}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: fastapi-server-test:local
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  networks:
    - application

services:
  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - application

  migrate:
    <<: *app-service
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uv
      - run
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: fastapi-server-test-postgres-data

networks:
  application:
    name: fastapi-server-test-network
